    enabled: false
    source: bm

  gc_filter_other_log:
    field: "GCf oth"
    enabled: false
    source: bm

  # pages that went on to be read
  gc_filter_passed:
    field: "GCf pass"
    enabled: false
    source: bm

  # hot pages deferred, per second
  gc_hot_deferred:
    field: "GChot def"
    enabled: false
    source: bm

  gc_drain_rounds:
    field: "GCdrn rnd"
    enabled: false
    source: bm

  # RU epochs of the DEFAULT_RUH
  ru_open:
    field: "RU open"
    enabled: false
    source: bm

  ru_reclaiming:
    field: "RU rcling"
    enabled: false
    source: bm

  ru_reclaimed:
    field: "RU rcld"
    enabled: false
    source: bm

  ru_oldest_uncollected:
    field: "RU oldest"
    enabled: false
    source: bm

  # 1: opening the next RU epoch is deferred, the GC is behind
  ru_next_slot_busy:
    field: "RUslot busy"
    enabled: false
    source: bm

  # writers stalled on a full LBA chain ring, per second
  lba_stalls:
    field: "LBA stalls"
    enabled: false
    source: bm

  # writers waiting on the ring right now
  lba_stalled_now:
    field: "LBA stall"
    enabled: false
    source: bm

  # writers spinning on a full or closed LBA chain block right now
  lba_closed_wait_now:
    field: "LBA closed"
    enabled: false
    source: bm

  # 1: the ru_epoch_mgr is closing the active LBA chain block
  lba_closer_waiting:
    field: "LBA closer"
    enabled: false
    source: bm

  # workers blocked on an IO frame of the fixer right now
  wk_fixer_wait_now:
    field: "WKfix wait"
    enabled: true
    source: bm

  # per second
  wk_fixer_waits:
    field: "WKfix waits"
    enabled: false
    source: bm

  # summed over the workers, per second
  wk_fixer_wait_ms:
    field: "WKfix ms"
    enabled: false
    source: bm

  # longest single wait in the last second
  wk_fixer_max_wait_ms:
    field: "WKfix max"
    enabled: false
    source: bm

  # waits on any IO frame being read, per second
  wk_io_reading_waits:
    field: "WKio waits"
    enabled: false
    source: bm

  # retries on a TO_DELETE IO frame, per second
  wk_io_to_delete_retries:
    field: "WKio del"
    enabled: false
    source: bm
